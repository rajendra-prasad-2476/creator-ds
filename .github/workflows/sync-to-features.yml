# sync-to-features.yml
#
# Triggers on any push to main that changes:
#   - src/components/ui/**   (DS components)
#   - src/templates/**       (page templates)
#   - src/patterns/**        (reusable patterns)
#   - AGENTS.md              (AI instructions)
#
# What it does:
#   1. Checks out both repos
#   2. Rsyncs the relevant folders into creator-features
#   3. Opens a PR in creator-features so the team can review changes
#
# Setup required (one-time, by a repo admin):
#   1. Create a GitHub PAT with `repo` scope
#   2. Add it as a secret called SYNC_TOKEN in creator-ds-react repo settings
#   3. Update TARGET_REPO below with your actual org/repo name

name: Sync Components to creator-features

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/**'
      - 'src/templates/**'
      - 'src/patterns/**'
      - 'AGENTS.md'

env:
  # ── GitHub org and target repo ───────────────────────────────────────────
  TARGET_REPO: rajendra-prasad-2476/creator-features
  # ──────────────────────────────────────────────────────────────────────────
  BRANCH_NAME: sync/components-${{ github.sha }}

jobs:
  sync:
    name: Sync DS artifacts to creator-features
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout this repo (creator-ds-react)
      - name: Checkout creator-ds-react
        uses: actions/checkout@v4
        with:
          path: creator-ds-react

      # 2. Checkout creator-features using the sync token
      - name: Checkout creator-features
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: creator-features

      # 3. Sync components
      - name: Sync src/components/ui/
        run: |
          mkdir -p creator-features/components/ui
          rsync -av --delete \
            creator-ds-react/src/components/ui/ \
            creator-features/components/ui/

      # 4. Sync templates
      - name: Sync src/templates/
        run: |
          mkdir -p creator-features/templates
          rsync -av --delete \
            creator-ds-react/src/templates/ \
            creator-features/templates/

      # 5. Sync lib/utils (needed by components)
      - name: Sync src/lib/
        run: |
          mkdir -p creator-features/lib
          rsync -av --delete \
            creator-ds-react/src/lib/ \
            creator-features/lib/

      # 6. Sync AGENTS.md
      - name: Sync AGENTS.md
        run: |
          cp creator-ds-react/AGENTS.md creator-features/AGENTS.md

      # 7. Check if there are any actual changes
      - name: Check for changes
        id: check_changes
        working-directory: creator-features
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # 8. Commit and push to a new branch
      - name: Commit synced files
        if: steps.check_changes.outputs.has_changes == 'true'
        working-directory: creator-features
        run: |
          git checkout -b ${{ env.BRANCH_NAME }}
          git add -A
          git commit -m "sync: DS components from creator-ds-react@${{ github.sha }}

          Changed files:
          $(cd ../creator-ds-react && git diff --name-only HEAD~1 HEAD -- src/components/ui/ src/templates/ src/patterns/ AGENTS.md 2>/dev/null || echo 'See commit for details')"
          git push origin ${{ env.BRANCH_NAME }}

      # 9. Open a Pull Request in creator-features
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          path: creator-features
          branch: ${{ env.BRANCH_NAME }}
          base: main
          title: "sync: DS component update from creator-ds-react"
          body: |
            ## Automated DS Sync

            This PR was automatically generated by the `sync-to-features` workflow
            in `creator-ds-react`.

            **Source commit:** `creator-ds-react@${{ github.sha }}`
            **Triggered by:** @${{ github.actor }}

            ### What changed
            Files synced from `creator-ds-react`:
            - `components/ui/` — DS component source files
            - `templates/` — Page-level template shells
            - `lib/` — Shared utilities
            - `AGENTS.md` — AI coding instructions

            ### Review checklist
            - [ ] No unexpected component regressions
            - [ ] New components appear in the components table in AGENTS.md
            - [ ] Template props are documented correctly

            > Auto-merge is safe if all checks pass and no conflicts exist.
          labels: |
            automated
            ds-sync
          draft: false
