# sync-to-features.yml
#
# Triggers on any push to main that changes:
#   - src/components/ui/**   (DS components)
#   - src/templates/**       (page templates)
#   - src/patterns/**        (reusable patterns)
#   - AGENTS.md              (AI instructions)
#
# What it does:
#   1. Checks out both repos
#   2. Rsyncs the relevant folders into creator-features/
#   3. Uses peter-evans/create-pull-request to stage, commit, branch, and open PR
#      (the action handles all of that atomically — do NOT manually commit before it)
#
# Setup required (one-time):
#   Add a GitHub PAT (repo scope) as secret SYNC_TOKEN in creator-ds settings

name: Sync Components to creator-features

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/**'
      - 'src/templates/**'
      - 'src/patterns/**'
      - 'AGENTS.md'

jobs:
  sync:
    name: Sync DS artifacts to creator-features
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout creator-ds (this repo)
      - name: Checkout creator-ds
        uses: actions/checkout@v4
        with:
          path: creator-ds

      # 2. Checkout creator-features using the sync token
      - name: Checkout creator-features
        uses: actions/checkout@v4
        with:
          repository: rajendra-prasad-2476/creator-features
          token: ${{ secrets.SYNC_TOKEN }}
          path: creator-features

      # 3. Rsync components, templates, lib, and AGENTS.md into creator-features
      - name: Sync files
        run: |
          mkdir -p creator-features/components/ui
          mkdir -p creator-features/templates
          mkdir -p creator-features/lib

          rsync -a --delete \
            creator-ds/src/components/ui/ \
            creator-features/components/ui/

          rsync -a --delete \
            creator-ds/src/templates/ \
            creator-features/templates/

          rsync -a --delete \
            creator-ds/src/lib/ \
            creator-features/lib/

          cp creator-ds/AGENTS.md creator-features/AGENTS.md

      # 4. Create a PR in creator-features with all changes
      #    The action handles: git add -A → commit → branch → push → PR
      - name: Open sync PR in creator-features
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          path: creator-features
          branch: sync/ds-${{ github.sha }}
          base: main
          commit-message: |
            sync: DS update from creator-ds@${{ github.sha }}
          title: "sync: DS component update from creator-ds"
          body: |
            ## Automated DS Sync

            Triggered by push to `creator-ds` main by @${{ github.actor }}.

            **Source commit:** [`${{ github.sha }}`](https://github.com/rajendra-prasad-2476/creator-ds/commit/${{ github.sha }})

            ### Files synced
            | Folder | Source |
            |---|---|
            | `components/ui/` | `creator-ds/src/components/ui/` |
            | `templates/` | `creator-ds/src/templates/` |
            | `lib/` | `creator-ds/src/lib/` |
            | `AGENTS.md` | `creator-ds/AGENTS.md` |

            ### Review checklist
            - [ ] No unexpected component regressions
            - [ ] New components appear in the AGENTS.md component table
            - [ ] Template props are documented correctly

            > Safe to auto-merge if all checks pass and no conflicts exist.
